<div class="container mt-3">
  <div class="row">
    <div *ngFor="let post of posts" class="col-md-4 mb-3">
      <div class="card post-card">
        <div class="card-body">
          <strong>{{ post.id }}.</strong>
          <div class="title">{{ post.title }}</div>

          <p class="post-body">
            {{ post.body }}
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
